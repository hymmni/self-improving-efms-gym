# GPU 있는 학습 서버에서만 추가로 붙이는 override.
# 사용법: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# (nvidia-container-toolkit이 설치돼 있어야 함: https://github.com/NVIDIA/nvidia-container-toolkit)
services:
  dev:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
