defaults:
  - task: square
  - policy: diffusion_unet
  - _self_

# task/policy는 policy_ckpt 옆 run_config.yaml이 있으면 그걸로 덮어쓴다(scripts/train_si.py의
# _apply_run_config, eval.py/train_dstg.py와 동일 원칙) — 위 defaults는 run_config.yaml이 없는
# (구) 체크포인트용 fallback일 뿐이다.
policy_ckpt: /home/moai/hymm_ws/square_ckpt/policy_epoch1060.pt
dstg_ckpt: outputs/dstg/square_demo50_succ/predictor.pt   # step 1이 실제로 저장한 경로(index.json 참고)
statistic: mean            # mean | cvar (DstgReward에 그대로 전달)
cvar_alpha: 0.8
gamma: 0.9                 # 논문 기본값
reinforce_scale: 5.0e-2    # 논문 c
lr: 1.0e-6                 # 파인튜닝이라 사전학습 lr(1e-4)보다 훨씬 작게 — train.yaml의
                            # system=apo 파인튜닝 lr(1e-6~1e-7 권장) 실측 근거를 그대로 따른다.
termination: learned        # learned | env — 보상은 항상 d로만 만든다. 이 값은 "언제
                            # 에피소드를 끝내는가"만 바꾼다(phase 4 step 3과 동일 원칙).
advantage_norm: false       # true면 배치 평균 baseline(편향 없이 분산만 줄임). 기본 off인
                            # 이유는 논문이 리턴을 그대로 쓰기 때문(phase 4와 동일 근거).
iterations: ???
episodes_per_iter: ???      # 기본값을 못 박지 않는다 — 1 에피소드 실측 시간으로 정할 것
                            # (step3.md "계산 비용 경고" 절 참고).
seed0: 900000               # 학습 롤아웃 시드 시작점. 아직 평가 phase가 시드 대역을 정하지
                            # 않아 900000으로 두되, 실제 평가 phase에서 재검토가 필요하다.
out: ???
device: cuda

max_steps: 1000             # eval.yaml의 max_steps와 동일 기본값(성공 에피소드 평균 466스텝,
                            # 범위 382~780, EXP-10.md 실측 근거 그대로 재사용).

logp_batch: 256              # (결정, 역확산-단계) 쌍 미니배치 크기 — phase 4 step 3과 동일 이름이지만
                            # 값은 그대로 베끼지 않았다. GraspCarry2D는 작은 MLP라 4096이 안전했지만
                            # square의 UNet(down_dims 512/1024/2048)은 훨씬 크다 — 스모크 실행에서
                            # logp_batch=4096이 공유 GPU(다른 프로세스가 이미 14GB+ 점유 중)에서
                            # 실측 CUDA OOM(단일 forward+backward에 17GB+ 필요)을 냈다. 256은 같은
                            # 실행에서 문제없이 통과했다(2026-08-09 스모크 로그 근거).

# termination=="learned"일 때 DstgReward.success()에 쓸 문턱 캘리브레이션(step 2
# calibrate_threshold 재사용, train_carry_si.py와 동일 원칙) — held-out split은 step 1이
# 학습에서 제외한 데모와 같은 알고리즘(다른 seed 가능)으로 다시 뽑는다.
calib_hdf5_path: /home/moai/hymm_ws/square_dataset/square_image_v15.hdf5
calib_val_fraction: 0.2
calib_split_seed: 0

hydra:
  run:
    dir: outputs/si/hydra/${now:%Y%m%d-%H%M%S}
